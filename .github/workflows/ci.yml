name: CI

on:
  push:
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Setup für Backend
      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Setup für Frontend
      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependencies installieren
        working-directory: frontend
        run: npm ci

      - name: Playwright Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Backend im Hintergrund starten
      - name: Backend starten
        working-directory: backend
        run: |
          mvn spring-boot:run -Dspring-boot.run.profiles=test > backend_log.txt 2>&1 &
          echo "Warten auf Backend..."
          npx wait-on http://localhost:8080/h2-console --timeout 60000

      # E2E Tests ausführen
      - name: E2E Tests ausführen
        working-directory: frontend
        run: npm run e2e:ci

      # Artefakte hochladen
      - name: Upload E2E Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
            backend/backend_log.txt
          if-no-files-found: warn

  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend Build + Unit Tests
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: Test Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
          if-no-files-found: warn