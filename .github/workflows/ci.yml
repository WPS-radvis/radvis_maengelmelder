---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  lint-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Linter
      - name: Lint Code Base
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLFLUFF_DEFAULT_DIALECT: ansi

      # 2. Setup
      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependencies installieren
        working-directory: frontend
        run: npm ci

      - name: Playwright Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 3. Backend & E2E
      - name: Backend starten
        working-directory: backend
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=test > backend_log.txt 2>&1 &
          npx wait-on http://localhost:8000/h2-console --timeout 150000 || (cat backend_log.txt && exit 1)

      - name: E2E Tests ausführen
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload E2E Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            frontend/test-results/
            frontend/playwright-report/

  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend Build + Unit Tests
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

      - name: Test Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports