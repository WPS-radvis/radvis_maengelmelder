name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Backend (Test Profile)
        working-directory: backend
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=test > backend_log.txt 2>&1 &
          npx wait-on http://localhost:8000/h2-console --timeout 150000 || (cat backend_log.txt && exit 1)

      - name: Start Frontend
        working-directory: frontend
        run: |
          npm run dev &
          npx wait-on http://localhost:4200 --timeout 120000

      - name: Run E2E Tests
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7